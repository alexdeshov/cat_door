<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CatDoor{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script>
    // Тема применяется до первой отрисовки: иначе тёмный интерфейс на секунду
    // моргнёт белым, а именно на крыльце днём это самый неприятный кадр.
    try {
      const saved = localStorage.getItem("catdoor-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch (error) {
      // Приватный режим запрещает хранилище — остаётся системная тема.
    }
  </script>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>CatDoor</a>
    <nav class="nav">
      <a href="/" {% if page == "passes" %}aria-current="page"{% endif %}>Проходы</a>
      <a href="/cameras" {% if page == "cameras" %}aria-current="page"{% endif %}>Камеры</a>
      <a href="/metrics" {% if page == "metrics" %}aria-current="page"{% endif %}>Метрики</a>
    </nav>
    <div class="masthead-tools">
      <span class="chip" title="Система не отправляет команды двери">Дверь не управляется</span>
      <button id="theme-toggle" type="button" aria-label="Переключить тему">Тема</button>
    </div>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
  const themeToggle = document.querySelector("#theme-toggle");

  function currentTheme() {
    if (document.documentElement.dataset.theme) return document.documentElement.dataset.theme;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  themeToggle.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try {
      localStorage.setItem("catdoor-theme", next);
    } catch (error) {
      // Не сохранилось — переключение всё равно действует до перезагрузки.
    }
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
