{% extends "_base.html" %}
{% set circuit = "logs" %}
{% block title %}CatDoor — журналы{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel-head">
    <h2>Журналы служб</h2>
    <span class="muted">хвост journald и решений recorder — без ssh</span>
  </div>
  <div class="panel-body">
    <div class="controls">
      <label for="log-source">источник</label>
      <select id="log-source">
        {% for source in sources %}
          <option value="{{ source.key }}" {{ "selected" if source.key == selected }}>{{ source.title }}</option>
        {% endfor %}
      </select>
      <label for="log-lines">строк</label>
      <input id="log-lines" type="number" min="1" max="{{ max_lines }}" value="{{ lines }}" style="width: 6em">
      <label for="log-filter">фильтр</label>
      <input id="log-filter" type="text" placeholder="подстрока или /регэксп/" style="width: 16em">
      <button id="log-refresh" type="button" class="primary">Обновить</button>
      <label class="controls" style="font-size: 13px">
        <input id="log-auto" type="checkbox"> каждые 10 с
      </label>
      <span id="log-status" class="muted data" style="font-size: 12px"></span>
    </div>
    <p id="log-hint" class="muted" style="font-size: 13px">{{ hints.get(selected, "") }}</p>
    <pre id="log-body" class="data" style="font-size: 11.5px; line-height: 1.35; max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-word"></pre>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  const hints = {{ hints | tojson }};
  const source = document.querySelector("#log-source");
  const linesInput = document.querySelector("#log-lines");
  const filterInput = document.querySelector("#log-filter");
  const body = document.querySelector("#log-body");
  const status = document.querySelector("#log-status");
  const hint = document.querySelector("#log-hint");
  let timer = null;

  function matcher(raw) {
    const value = raw.trim();
    if (!value) return () => true;
    if (value.length > 2 && value.startsWith("/") && value.endsWith("/")) {
      try { const re = new RegExp(value.slice(1, -1), "i"); return line => re.test(line); }
      catch (error) { return () => true; }
    }
    const needle = value.toLowerCase();
    return line => line.toLowerCase().includes(needle);
  }

  async function load() {
    const key = source.value;
    hint.textContent = hints[key] || "";
    status.textContent = "…";
    try {
      const response = await fetch(`/api/logs/${key}?lines=${Number(linesInput.value) || 200}`);
      const result = await response.json();
      if (!response.ok) throw new Error(result.detail || `ошибка ${response.status}`);
      const keep = matcher(filterInput.value);
      const lines = (result.text || "").split("\n").filter(keep);
      body.textContent = lines.join("\n") || (result.error ? "" : "(журнал пуст)");
      status.textContent = result.error
        ? result.error
        : `${lines.length} строк · ${new Date().toLocaleTimeString("ru-RU")}`;
      status.classList.toggle("bad", Boolean(result.error));
      body.scrollTop = body.scrollHeight;
      const url = new URL(window.location);
      url.searchParams.set("source", key);
      history.replaceState(null, "", url);
    } catch (error) {
      status.textContent = error.message;
      status.classList.add("bad");
    }
  }

  document.querySelector("#log-refresh").addEventListener("click", load);
  source.addEventListener("change", load);
  filterInput.addEventListener("input", () => { clearTimeout(filterInput._t); filterInput._t = setTimeout(load, 300); });
  document.querySelector("#log-auto").addEventListener("change", event => {
    clearInterval(timer);
    if (event.target.checked) timer = setInterval(load, 10000);
  });
  load();
</script>
{% endblock %}
