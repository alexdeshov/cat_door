# DHCP для изолированной сети камер на eno1.
#
# Копируется в /etc/dnsmasq.d/catdoor-cameras.conf. Камеры подключены к
# PoE-коммутатору, который воткнут только в eno1 мини-PC: наружу этот сегмент не
# ведёт, и адреса им выдать больше некому.
#
# Заводская Hikvision сначала просит адрес по DHCP и лишь потом откатывается на
# 192.168.1.64. Без сервера все камеры одной модели окажутся на этом адресе
# разом и передерутся, поэтому DHCP здесь не удобство, а необходимость.

# Только внутренний интерфейс: в домашней сети DHCP-сервер уже есть, и второй
# там не нужен. bind-dynamic открывает сокет именно на нём, как и
# bind-interfaces, но переживает интерфейс, появившийся позже себя.
#
# Разница не теоретическая. С bind-interfaces узел не поднимался после
# перезагрузки: dnsmasq стартует раньше, чем netplan успевает настроить eno1, и
# падает с «unknown interface eno1». При ручном запуске сеть давно поднята,
# поэтому дефект не виден до первой настоящей перезагрузки.
interface=eno1
bind-dynamic

# DNS выключен полностью: 53-й порт уже занят systemd-resolved, а камерам
# разрешение имён не нужно. Нужен только DHCP.
port=0

# Пул поднят выше всех заводских адресов, а не просто выше сервера.
#
# 192.168.1.10 закреплён за узлом в netplan. Дальше идут заводские адреса, на
# которые камеры встают после сброса и с которых начинают жизнь новые:
# 192.168.1.64 у Hikvision и HiWatch, 192.168.1.108 у Dahua — а на платформе
# Dahua сделаны и Nobelic, и часть камер Ivideon.
#
# Пул, накрывающий такой адрес, — тихая мина. Камера с заводской статикой держит
# его молча, dnsmasq тем временем выдаёт тот же адрес соседке по DHCP, и дальше
# кадры приходят от того, чей ARP-ответ пришёл последним. Со стороны узла это
# выглядит как неверный пароль: RTSP отвечает 401, потому что отвечает не та
# камера. Ровно так 4 августа камера участка перехватила адрес камеры дверцы.
#
# Поэтому нижняя граница — выше 108, с запасом на будущие модели.
dhcp-range=192.168.1.180,192.168.1.240,12h

# Пустое значение опции означает «не отправлять её вовсе». Без шлюза и без DNS
# камера получает адрес, но дороги в интернет у неё не появляется — этого и
# требует docs/cameras.md.
dhcp-option=3
dhcp-option=6

# Сегмент наш целиком, чужого DHCP тут быть не может: отвечаем сразу, не
# выжидая, и переназначаем адрес камере, которая пришла с чужой арендой.
dhcp-authoritative

# Каждая выданная аренда попадает в журнал вместе с MAC. Так находится
# подключённая камера, у которой нет ни экрана, ни известного адреса.
log-dhcp
