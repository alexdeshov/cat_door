# Сервер времени для изолированной сети камер.
#
# Копируется в /etc/chrony/conf.d/catdoor-cameras.conf.
#
# Камерам время нужно не для красоты: HiWatch вжигает штамп в сам кадр, а
# Frigate раскладывает записи по времени события. Камера, приехавшая с завода,
# стоит на 1970 или 2000 годе, и сверить их ей не с чем: прописанные
# производителем pool.ntp.org и clock.isc.org лежат в интернете, куда из сети
# камер хода нет. Так все четыре камеры узла и прожили до 5 августа с
# неверными часами.
#
# Раздавать время может только узел: он единственный, кто стоит в обеих сетях.
# Свои часы он держит через обычный upstream в домашней сети.
allow 192.168.1.0/24

# Отдавать время, даже пока сам узел не синхронизирован с upstream: сеть камер
# изолирована, и час без интернета не повод оставлять камеры в 1970 году.
# Stratum 10 честно говорит клиентам, что источник запасной.
local stratum 10
