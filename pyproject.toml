[project]
name = "catdoor-ai"
version = "0.1.0"
description = "Local visual cat identification and automatic door control system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.7",
    # Состояние створки калитки приходит только в MQTT: по HTTP Frigate его не
    # отдаёт. Клиент лёгкий и нужен одной службе, но без него она молча теряет
    # единственный источник правды о том, открылась ли калитка.
    "paho-mqtt>=2.0",
]

# Раскладка проекта плоская: `src` — обычный пакет, а не корень src-layout.
# Без явного списка setuptools видит каталог `src/` и принимает раскладку за
# src-layout, кладёт в sys.path сам `src` и отдаёт наружу `common`/`recorder`/
# `web`. Импорты в коде и точки входа ниже используют `src.*`, поэтому пакеты
# перечисляются явно.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "training*"]

[project.scripts]
catdoor-web = "src.web.app:run"
catdoor-recorder = "src.recorder.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
    "numpy>=2.0",
    "pillow>=11.0",
    # Тесты разбирают собранную конфигурацию Frigate, а не сравнивают строки:
    # проверять YAML построчно значит проверять отступы вместо смысла.
    "pyyaml>=6.0",
]
training = [
    "torch>=2.6",
    "torchvision>=0.21",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "numpy>=2.0",
    "pillow>=11.0",
]
acceptance = [
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "pillow>=11.0",
]
inference = [
    "openvino>=2025.0,<2027",
    "numpy>=2.0",
    "pillow>=11.0",
]
# Квантование живёт на маке, а не на узле: сбор статистики бэкендом `onnx` идёт
# через onnxruntime, и тащить его вместе с NNCF на боевую машину незачем.
# Отдельным extra, а не в `dev`: `tests/test_packaging.py` требует, чтобы суита
# запускалась от одного `.[dev]`, а тесты квантования работают на поддельном
# `nncf` в `sys.modules`.
quantization = [
    "nncf>=2.14",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "openvino>=2025.0,<2027",
    "numpy>=2.0",
    "pillow>=11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Тесты импортируют `src`, `scripts` и `training` из корня репозитория. Без
# этой строки суита собирается только при запуске через `python -m pytest`,
# который сам добавляет текущий каталог в sys.path; консольный скрипт `pytest`
# его не добавляет и падает на импортах.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.mypy.overrides]]
module = ["nncf", "nncf.*", "onnx", "onnxruntime", "openvino", "paho", "paho.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true
